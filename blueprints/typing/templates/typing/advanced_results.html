<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=yes">
    <title>HelloType Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='typing/styles.css') }}">
</head>
<body>
    <main>
        <h1 class="hellotype" id="herotitle">AdvancedType</h1>
        <section id="results">
            <h2>Results</h2>
            <div class="metrics">
                <p>Name: <span id="name">{{name}}</span></p>
                <p>Speed: <span id="wpm">{{wpm}} WPM</span></p>
                <p>Accuracy: <span id="accuracy">{{accuracy}}%</span></p>
                <p>Time: <span id="time">{{time}}s</span></p>
                <!--<p>Mistakes: <span id="mistakes">{{mistakes}}</span></p>-->
                <button id="tryagain-btn">Try again</button>
                <button id="startover-btn">Start Over</button>
            </div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='typing/hellotype_results.js') }}"></script>
    <div class="banner"><span id="banner-text">This was made for The Kingston Acadmey's Open Evening 2025. Thank you for visiting The Kingston Acamdey!</span></div>
</body>
</html>
