<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=yes">
    <title>HelloType</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='typing/styles.css') }}">
</head>
<body>
    <main>
        <h1 class="hellotype">HelloType</h1>
        <section id="results">
            <h2>Results</h2>
            <p>WPM: <span id="wpm">{{wpm}}</span></p>
            <p>Accuracy: <span id="accuracy">{{accuracy}}</span></p>
            <p>Time: <span id="time">{{time}}</span>s</p>
            <p>Mistakes: <span id="mistakes">{{mistakes}}</span></p>
        </section>
    </main>
    <script src="{{ url_for('static', filename='typing/script.js') }}"></script>
</body>
</html>
